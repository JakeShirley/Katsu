name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS Build
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 27 SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $sdk_version"
          sdk_major="${sdk_version%%.*}"
          sdk_minor="$(echo "$sdk_version" | cut -s -d. -f2)"
          if [ "$sdk_major" -lt 27 ] || { [ "$sdk_major" -eq 27 ] && [ "${sdk_minor:-0}" -lt 1 ]; }; then
            echo "::error::Expected iOS 27.1 SDK or newer (required for iPhone Duo), got $sdk_version"
            exit 1
          fi

      - name: Build iOS app
        run: |
          xcodebuild \
            -project src/Katsu.xcodeproj \
            -scheme Katsu \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
