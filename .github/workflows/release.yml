name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    environment: AppStore

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Verify Xcode 27 SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $sdk_version"
          sdk_major="${sdk_version%%.*}"
          sdk_minor="$(echo "$sdk_version" | cut -s -d. -f2)"
          if [ "$sdk_major" -lt 27 ] || { [ "$sdk_major" -eq 27 ] && [ "${sdk_minor:-0}" -lt 1 ]; }; then
            echo "::error::Expected iOS 27.1 SDK or newer for App Store Connect uploads (required for iPhone Duo), got $sdk_version"
            exit 1
          fi

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: org.odinseye.katsu
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Upload app to Test Flight
        if: ${{ hashFiles('build/TestFlight/export/Katsu.ipa') != '' }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/TestFlight/export/Katsu.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          wait-for-processing: "true"
